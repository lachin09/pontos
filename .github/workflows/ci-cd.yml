name: CI/CD

# Every push and pull request: checks → Vercel preview → browser tests.
# Pushes to main then deploy to production. Vercel's own Git deployments are
# switched off in vercel.json, so this workflow is the only way code goes live.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen
      - run: npx tsc --noEmit
      # Unit and component tests use fakes: no Supabase secrets needed.
      - run: npm test

  preview:
    name: Deploy preview
    needs: checks
    # Pull requests from forks get no secrets, so they stop after checks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global vercel@latest
      # Vercel builds remotely with the project's own environment variables.
      - id: deploy
        run: |
          url=$(vercel deploy --yes --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: Browser tests on preview
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: ${{ needs.preview.outputs.url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Read-only against real data; tests/e2e/fixtures.ts blocks placing orders.
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  production:
    name: Deploy production
    needs: e2e
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://pontos-xi.vercel.app
    # Never cancel a production deploy halfway.
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global vercel@latest
      - id: deploy
        run: |
          url=$(vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke-check the live site
        run: |
          set -e
          base=https://pontos-xi.vercel.app
          for path in / /catalog /cart /checkout /admin/login; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 5 "$base$path")
            echo "$path → $code"
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
          done
          code=$(curl -s -o /dev/null -w "%{http_code}" "$base/this-page-does-not-exist")
          [ "$code" = "404" ] || { echo "::error::404 page returned $code"; exit 1; }
